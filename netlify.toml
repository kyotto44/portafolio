# Configuración de Netlify para el portafolio.
# Netlify instala las dependencias, ejecuta "npm run build" y publica la carpeta dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cabeceras de seguridad para todas las páginas.
[[headers]]
  for = "/*"
  [headers.values]
    # Solo recursos del propio sitio: sin CDN, sin fuentes externas, sin scripts en línea.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"

# Los archivos compilados llevan hash en el nombre: se pueden guardar un año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las capturas no llevan hash: si se regeneran con el mismo nombre, en un día se ve la nueva.
[[headers]]
  for = "/capturas/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"
